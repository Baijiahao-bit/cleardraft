[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleardraft"
version = "0.1.0"
description = "Local document rebuilding and bounded Unicode/metadata auditing. Not a textGrain remover."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["python-docx==1.2.0", "lxml==6.1.3", "pypdf==6.20.0", "reportlab==5.0.1", "defusedxml==0.7.1"]

[project.scripts]
cleanroom = "cleanroom.cli:main"

[tool.setuptools.packages.find]
include = ["cleanroom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cleanroom"]

[tool.coverage.report]
show_missing = true
fail_under = 80
