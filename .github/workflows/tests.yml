name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
      - name: Run tests with coverage on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov=cleanroom --cov-report=term-missing --cov-fail-under=80
      - name: Run tests with coverage on Windows
        if: runner.os == 'Windows'
        run: python -m pytest --cov=cleanroom --cov-report=term-missing --cov-fail-under=80
